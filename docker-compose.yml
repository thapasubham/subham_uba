services:
  database:
    image: postgres
    restart: unless-stopped
    ports:
      - 8000:5432
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - uba_intern

  backend:
    depends_on:
      - database
    restart: unless-stopped
    build: ./
    env_file: .env
    ports:
      - "3000:${PORT}"
    environment:
      PORT: ${PORT}
      TEST_PORT: ${TEST_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SECRET: ${SECRET}
      URL: ${URL}
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
    networks:
      - uba_intern

networks:
  uba_intern:
    driver: bridge

volumes:
  db:
